version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.0.9 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter '@cocktail-taste-test/contracts' build
            - pnpm --filter web build
            - pwd
            - ls -ld node_modules/next
            - readlink node_modules/next
            - 'node -p "require.resolve(''next/package.json'')"'
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/.cache/**/*
          - apps/web/.next/cache/**/*
