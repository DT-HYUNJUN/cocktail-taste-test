version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.0.9 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter '@cocktail-taste-test/contracts' build
            - pnpm --filter web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/.cache/**/*
          - apps/web/.next/cache/**/*
