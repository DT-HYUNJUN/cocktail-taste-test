services:
  postgres:
    image: postgres:17-alpine
    container_name: cocktail-taste-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocktail
      POSTGRES_PASSWORD: cocktail_dev_password
      POSTGRES_DB: cocktail_taste
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocktail -d cocktail_taste"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
