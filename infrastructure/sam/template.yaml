AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Draft only - Cocktail Taste Test NestJS API on Lambda. Do not deploy before security approval.

Parameters:
  ServerAuthAuthorizerArn:
    Type: String
    Description: Required ARN of the approved HTTP API request authorizer. No public unauthenticated default is provided.
    AllowedPattern: "^arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9-_]+(:[A-Za-z0-9-_]+)?$"
  DatabaseHost:
    Type: String
  DatabasePort:
    Type: Number
    Default: 5432
  DatabaseUser:
    Type: String
    NoEcho: true
  DatabasePassword:
    Type: String
    NoEcho: true
  DatabaseName:
    Type: String

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: production
        DATABASE_HOST: !Ref DatabaseHost
        DATABASE_PORT: !Ref DatabasePort
        DATABASE_USER: !Ref DatabaseUser
        DATABASE_PASSWORD: !Ref DatabasePassword
        DATABASE_NAME: !Ref DatabaseName
        DATABASE_SSL_MODE: require
        DATABASE_POOL_MAX: 1
        DATABASE_CONNECTION_TIMEOUT_MS: 5000
        DATABASE_IDLE_TIMEOUT_MS: 30000

Resources:
  CocktailTasteHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: ServerRequestAuthorizer
        Authorizers:
          ServerRequestAuthorizer:
            FunctionArn: !Ref ServerAuthAuthorizerArn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: false
            Identity:
              Headers:
                - authorization

  CocktailTasteApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cocktail-taste-api
      CodeUri: ../../.lambda/package/
      Handler: index.handler
      ReservedConcurrentExecutions: 2
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref CocktailTasteHttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: "2.0"
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref CocktailTasteHttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"

  CocktailTasteApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/cocktail-taste-api
      RetentionInDays: 14

Outputs:
  HttpApiId:
    Description: HTTP API identifier. The endpoint requires the configured authorizer.
    Value: !Ref CocktailTasteHttpApi
